; PHP-FPM pool for the app container. Replaces Ubuntu's default
; /etc/php/8.3/fpm/pool.d/www.conf wholesale (see docker/8.3/Dockerfile).
;
; clear_env=no is load-bearing: FPM clears the process environment for
; workers by default, which would hide the DB_/REDIS_/etc. vars docker-compose
; injects via `environment:` — those worked for free under `artisan serve`
; because the CLI SAPI inherits the process environment directly.
[www]
user = sail
group = sail
listen = 127.0.0.1:9000
; static pre-forks all workers at startup instead of forking on demand —
; dynamic's default start_servers/spare-server counts left too few workers
; warm for a 6-request burst, so the benchmark saw 3-4x instead of ~1x.
pm = static
pm.max_children = 8
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
