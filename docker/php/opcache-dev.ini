; DEV-ONLY opcache tuning — mounted by docker-compose.yml, NOT baked into the image and
; NOT used by docker-compose.prod.yml. Keep it that way: disabling timestamp validation
; means code changes aren't picked up without a container restart, which is fine for local
; iteration but would silently serve stale bytecode after a production `git pull` that
; doesn't fully recreate the app/queue/scheduler containers.
;
; Why: the app is bind-mounted from a Windows/OneDrive host path, which makes every
; filesystem stat() extremely slow inside the container. Default opcache.revalidate_freq=2
; means nearly every request re-stats every included file against that slow mount.
; Disabling timestamp validation eliminates that per-request stat storm.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 30000
opcache.memory_consumption = 256
