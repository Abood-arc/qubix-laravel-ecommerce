; Upload limits for admin file uploads (logos, product images, etc.)
; This file is baked into the image (docker/8.3/Dockerfile) and ships to BOTH dev and
; production builds — keep it limited to settings that are safe everywhere. Dev-only
; tuning (e.g. opcache) belongs in docker/php/opcache-dev.ini instead, which is mounted
; only by the dev docker-compose.yml, never by docker-compose.prod.yml.
upload_max_filesize = 64M
post_max_size       = 128M
memory_limit        = 256M
max_execution_time  = 120

; Opcache sized for this codebase (about 15,000 PHP files with vendor). The
; stock 10,000-file / 128 MB / 8 MB-strings limits are smaller than the app,
; so files kept falling out of the cache. Timestamps stay validated, so a
; production `git pull` is still picked up without a restart.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
