# In-container static file server + FastCGI front for Laravel. Replaces the
# per-client `artisan serve` single-process bottleneck (see docker/8.3/Dockerfile).
# The shared external Caddy still reverse_proxys to this container's port 80
# unchanged — only what answers on that port inside the container has changed.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # No nginx version in responses (the artisan-serve stack it replaced sent
    # no Server header at all).
    server_tokens off;

    # Default Ubuntu nginx.conf writes to /var/log/nginx/*.log inside the
    # container — invisible to `docker logs`, never rotated, gone on
    # recreate. Sending straight to stdout/stderr puts these under the same
    # `json-file` log-driver rotation as everything else in `docker logs`.
    access_log /dev/stdout;
    error_log /dev/stderr;

    client_max_body_size 128M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller may execute. Uploads land on the `public`
    # disk (FILESYSTEM_DISK=public, served under /storage), so without this
    # an upload-validation bug elsewhere would become code execution.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
