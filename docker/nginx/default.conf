# In-container static file server + FastCGI front for Laravel. Replaces the
# per-client `artisan serve` single-process bottleneck (see docker/8.3/Dockerfile).
# The shared external Caddy still reverse_proxys to this container's port 80
# unchanged — only what answers on that port inside the container has changed.
# Resized product and banner images (/cache/{template}/{file}) are made by
# Laravel's image-cache route and never change for a given URL: the app
# already answers them with a one-year public max-age, and uploads get new
# random file names. Keeping each answer here means a page's 20-60 images
# stop queuing for the same few PHP workers as the cart and product APIs.
fastcgi_cache_path /var/cache/nginx/imagecache levels=1:2 keys_zone=imagecache:10m
                   max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # No nginx version in responses (the artisan-serve stack it replaced sent
    # no Server header at all).
    server_tokens off;

    # Default Ubuntu nginx.conf writes to /var/log/nginx/*.log inside the
    # container — invisible to `docker logs`, never rotated, gone on
    # recreate. Sending straight to stdout/stderr puts these under the same
    # `json-file` log-driver rotation as everything else in `docker logs`.
    access_log /dev/stdout;
    error_log /dev/stderr;

    client_max_body_size 128M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite output: every file name carries a content hash, so a changed file
    # is a new URL and the old one can be kept for good.
    location ~ ^/(themes/[^/]+/[^/]+/)?build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Uploads (logo, favicon, banners) are stored under random names, so a new
    # upload is a new URL. A month, revalidated quietly in the background.
    location ^~ /storage/ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri /index.php?$query_string;
    }

    location ^~ /cache/ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;

        fastcgi_cache imagecache;
        fastcgi_cache_key $request_uri;
        fastcgi_cache_valid 200 365d;
        fastcgi_cache_lock on;
        fastcgi_cache_use_stale error timeout updating;
        # Never store or hand out a cookie with a shared image.
        fastcgi_ignore_headers Set-Cookie;
        fastcgi_hide_header Set-Cookie;
        add_header X-Image-Cache $upstream_cache_status;
    }

    # Only the front controller may execute. Uploads land on the `public`
    # disk (FILESYSTEM_DISK=public, served under /storage), so without this
    # an upload-validation bug elsewhere would become code execution.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
