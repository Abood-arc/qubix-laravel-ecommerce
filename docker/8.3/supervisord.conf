[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; PHP-FPM workers (docker/php/fpm-pool.conf) + nginx (docker/nginx/default.conf)
; replace a single `artisan serve` process, which served every request for a
; store — including all of a page's asset requests — off one PHP process.
; Master runs as root so it can fork pool workers as the `sail` user; nginx's
; master likewise runs as root to bind :80, dropping to `sail` for workers
; (see the `user sail;` sed in docker/8.3/Dockerfile).
[program:php-fpm]
command=/usr/sbin/php-fpm8.3 -F
user=root
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

; Shop storefront assets (packages/DigitalLabs/Shop). Toggle with SAIL_VITE_SHOP in .env / compose.
[program:vite-shop]
command=/usr/local/bin/run-vite-shop.sh
user=sail
directory=/var/www/html
environment=LARAVEL_SAIL="1",HOME="/home/sail"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=10
startsecs=5
stopwaitsecs=15
