[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Shop storefront assets (packages/DigitalLabs/Shop). Toggle with SAIL_VITE_SHOP in .env / compose.
[program:vite-shop]
command=/usr/local/bin/run-vite-shop.sh
user=sail
directory=/var/www/html
environment=LARAVEL_SAIL="1",HOME="/home/sail"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=10
startsecs=5
stopwaitsecs=15
